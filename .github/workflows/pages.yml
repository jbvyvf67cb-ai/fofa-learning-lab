name: Deploy Fofa Learning Lab to GitHub Pages

# No build step — the repository IS the site (static HTML/CSS/JS). This publishes
# the whole repo (Fofa landing + science/ + writing/ + math/ + reading/) to Pages
# on every push to the working branch, and can be run on demand from the Actions tab.
#
# One-time setup on the repo: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/fofa-learning-lab-setup-zmkbd5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run supersede an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
